# ==============================================================================
# OpenTelemetry Collector Configuration for adk-otel
# ==============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "127.0.0.1:4317"
      http:
        endpoint: "127.0.0.1:4318"

processors:
  batch:
    timeout: 1s
    send_batch_size: 256

connectors:
  spanmetrics:
    histogram:
      explicit:
        buckets: [2ms, 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2500ms, 5s, 10s, 30s, 80s]
    exemplars:
      enabled: true
    dimensions:
      - name: gen_ai.system
      - name: gen_ai.request.model
      - name: gen_ai.response.model
      - name: gen_ai.operation.name
      - name: http.status_code
  sum:
    spans:
      gen_ai_client_token_usage_input:
        source_attribute: gen_ai.usage.input_tokens
        attributes:
          - key: gen_ai.request.model
            default_value: "gemini-2.5-flash"
          - key: gen_ai_token_type
            default_value: "input"
      gen_ai_client_token_usage_output:
        source_attribute: gen_ai.usage.output_tokens
        attributes:
          - key: gen_ai.request.model
            default_value: "gemini-2.5-flash"
          - key: gen_ai_token_type
            default_value: "output"

exporters:
  # Forward spans over OTLP/gRPC to Jaeger on loopback 14317 (TLS disabled for local dev)
  otlp/jaeger:
    endpoint: "127.0.0.1:14317"
    tls:
      insecure: true

  # Expose Prometheus/OpenMetrics endpoint for Prometheus scraping with exemplars preserved
  prometheus:
    endpoint: "127.0.0.1:8889"
    enable_open_metrics: true
    resource_to_telemetry_conversion:
      enabled: true

  # Detailed console output for local debugging and verification
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, debug, spanmetrics, sum]
    metrics:
      receivers: [otlp, spanmetrics, sum]
      processors: [batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
  telemetry:
    logs:
      level: info
    metrics:
      level: none
