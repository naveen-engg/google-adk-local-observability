# ==============================================================================
# Prometheus Scrape Configuration for adk-otel
# ==============================================================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "otel-collector"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["127.0.0.1:8889"]
        labels:
          environment: "local"
          application: "adk-otel"
