apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 5s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger

  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://127.0.0.1:16686
    editable: true
    jsonData:
      nodeGraph:
        enabled: true

  # Infinity datasource for Jaeger v2 /api/v3/traces queries
  # Needed because Grafana's built-in Jaeger search plugin has known compatibility
  # limitations when querying Jaeger v2 endpoints directly.
  - name: Jaeger v2 API
    type: yesoreyeram-infinity-datasource
    uid: jaeger-api
    access: proxy
    url: http://127.0.0.1:16686
    editable: true
    jsonData:
      allowedHosts:
        - http://127.0.0.1:16686
